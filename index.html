<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Inline favicon: no external requests -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230a0f16'/><circle cx='32' cy='27' r='9' fill='none' stroke='%23c9a227' stroke-width='3'/><path d='M12 44h40' stroke='%235f7f96' stroke-width='3' stroke-linecap='round'/></svg>">

<style>
  :root{
    --bg:#0a0f16;
    --bg-2:#0e1620;
    --ink:#eef3f8;
    --muted:#8ea3b5;
    --line:rgba(158,183,205,.16);
    --gold:#c9a227;
    --sea:#5f7f96;
  }

  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    display:flex;
    flex-direction:column;
    min-height:100svh;
    overflow-x:hidden;
  }

  /* ---- backdrop: horizon glow + slow drifting light ---- */
  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .backdrop::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 70% at 50% 108%, rgba(95,127,150,.28) 0%, transparent 60%),
      radial-gradient(70% 45% at 50% 0%, rgba(201,162,39,.10) 0%, transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 55%, #060a0f 100%);
  }
  /* the beam */
  .beam{
    position:absolute;left:50%;bottom:-10%;
    width:min(140vw,1400px);height:min(140vw,1400px);
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(201,162,39,.14), transparent 70%);
    animation:pulse 9s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  /* stars */
  .stars{position:absolute;inset:0;opacity:.5}
  .stars span{
    position:absolute;width:2px;height:2px;border-radius:50%;
    background:#dfe9f2;opacity:.0;
    animation:twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.7}}

  @media (prefers-reduced-motion:reduce){
    .beam,.stars span{animation:none}
    .stars span{opacity:.35}
  }

  /* ---- layout ---- */
  .wrap{
    position:relative;z-index:1;
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(2rem,6vw,4rem) 1.5rem;
    gap:clamp(1.5rem,4vw,2.25rem);
  }

  /* mark */
  .mark{width:56px;height:56px;opacity:.95}

  h1{
    margin:0;
    font-family:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-weight:500;
    font-size:clamp(2.1rem,7vw,4.25rem);
    letter-spacing:.06em;
    line-height:1.05;
    text-transform:uppercase;
  }
  h1 .soft{color:var(--muted);font-weight:400}

  .rule{
    width:min(320px,60vw);height:1px;border:0;margin:0;
    background:linear-gradient(90deg,transparent,var(--line) 20%,var(--gold) 50%,var(--line) 80%,transparent);
    opacity:.8;
  }

  .tagline{
    margin:0;
    max-width:34ch;
    font-size:clamp(1rem,2.4vw,1.3rem);
    line-height:1.6;
    color:var(--muted);
  }

  .status{
    display:inline-flex;align-items:center;gap:.6rem;
    padding:.5rem 1rem;
    border:1px solid var(--line);border-radius:999px;
    font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
    background:rgba(255,255,255,.02);
    backdrop-filter:blur(6px);
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 0 rgba(201,162,39,.6);
    animation:ping 2.4s ease-out infinite;
  }
  @keyframes ping{
    0%{box-shadow:0 0 0 0 rgba(201,162,39,.55)}
    70%{box-shadow:0 0 0 9px rgba(201,162,39,0)}
    100%{box-shadow:0 0 0 0 rgba(201,162,39,0)}
  }
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}

  .actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}

  .btn{
    display:inline-block;
    padding:.85rem 1.6rem;
    border-radius:999px;
    font-size:.95rem;font-weight:500;letter-spacing:.02em;
    text-decoration:none;
    transition:transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .btn-primary{background:var(--ink);color:#0a0f16}
  .btn-primary:hover{background:#fff}
  .btn-ghost{border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  footer{
    position:relative;z-index:1;
    padding:1.75rem 1.5rem;
    text-align:center;
    font-size:.8rem;
    color:var(--muted);
    border-top:1px solid var(--line);
  }
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
  footer a:hover{color:var(--ink);border-bottom-color:var(--line)}
  .verse{
    display:block;
    margin-top:.5rem;
    font-family:ui-serif,"Iowan Old Style",Georgia,serif;
    font-style:italic;
    font-size:.82rem;
    opacity:.55;
  }

  /* entrance */
  .fade{opacity:0;transform:translateY(12px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  .fade:nth-child(1){animation-delay:.05s}
  .fade:nth-child(2){animation-delay:.15s}
  .fade:nth-child(3){animation-delay:.25s}
  .fade:nth-child(4){animation-delay:.35s}
  .fade:nth-child(5){animation-delay:.45s}
  .fade:nth-child(6){animation-delay:.55s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <div class="stars">
    <span style="top:12%;left:18%;animation-delay:0s"></span>
    <span style="top:22%;left:74%;animation-delay:1.1s"></span>
    <span style="top:34%;left:41%;animation-delay:2.3s"></span>
    <span style="top:16%;left:57%;animation-delay:3.4s"></span>
    <span style="top:44%;left:11%;animation-delay:.7s"></span>
    <span style="top:28%;left:88%;animation-delay:1.9s"></span>
    <span style="top:52%;left:66%;animation-delay:2.8s"></span>
    <span style="top:9%;left:33%;animation-delay:4.1s"></span>
    <span style="top:38%;left:92%;animation-delay:3.1s"></span>
    <span style="top:58%;left:26%;animation-delay:1.4s"></span>
  </div>
  <div class="beam"></div>
</div>

<main class="wrap">

    <circle cx="32" cy="26" r="11" stroke="#c9a227" stroke-width="1.75" opacity=".9"/>
    <circle cx="32" cy="26" r="4" fill="#c9a227" opacity=".75"/>
    <path d="M8 46h48" stroke="#5f7f96" stroke-width="1.75" stroke-linecap="round"/>

  </svg>

  <h1 class="fade">Patmos <span class="soft">Software</span></h1>

  <hr class="rule fade">

  <p class="tagline fade">
    An app development studio. We're building the first thing now — the site follows shortly.
  </p>

  <span class="status fade"><span class="dot"></span>Coming soon</span>

  <div class="actions fade">
    <a class="btn btn-primary" href="mailto:hello@patmossoftware.com?subject=Patmos%20Software%20enquiry">Get in touch</a>
    <a class="btn btn-ghost" href="mailto:hello@patmossoftware.com?subject=Keep%20me%20posted">Keep me posted</a>
  </div>

</main>

<footer>
  <span>&copy; <span id="year">2026</span> Patmos Software &middot; <a href="mailto:hello@patmossoftware.com">hello@patmossoftware.com</a></span>
  <span class="verse">&ldquo;I was on the island called Patmos&hellip;&rdquo; &mdash; Revelation 1:9</span>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
